<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<!--
		Derived from docs/tasks.svg. Two things were changed and both matter:
		the glyph is a path rather than text, so it does not depend on a font
		being installed on the device, and the canvas is opaque Onyx rather than
		transparent — a launcher composites an icon onto its own wallpaper, and a
		floating green tick on nothing is what "no background" actually looks like.

		Colours are the brand tokens by value, because a standalone asset cannot
		read tokens.css: Onyx #0a0a10, Sea Green #058c42.
	-->
	<rect width="512" height="512" fill="#0a0a10" />
	<g transform="translate(-35.02,-36.45) scale(4.314)">
		<path
			fill="#058c42"
			d="m 39.621598,63.727972 q 2.687172,0 4.065209,4.409719 2.756074,8.268222 3.927406,8.268222 0.895724,0 1.86035,-1.378037 19.36142,-28.456465 35.828963,-40.514289 6.959087,-5.098737 13.573664,-5.098737 8.75054,0 10.54198,0.551215 0.75792,0.206706 0.75792,1.722546 0,1.240234 -1.58474,3.100584 -44.303889,50.849566 -52.778817,66.145775 -2.893878,5.23654 -13.366959,5.23654 -3.445093,0 -7.234695,-1.79144 -1.584742,-0.82683 -5.512148,-10.541988 -4.960933,-12.26453 -4.960933,-21.497378 0,-3.376191 4.82313,-5.58105 6.614577,-3.031682 9.921866,-3.031682 z"
		/>
	</g>
</svg>
